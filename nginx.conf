events {
    worker_connections 1024;
}

http {
    # Pastikan mime.types tersedia atau definisikan dasar-dasarnya
    types {
        text/html                             html htm shtml;
        text/css                              css;
        application/javascript                js;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        image/png                             png;
        image/svg+xml                         svg svgz;
    }

    server {
        listen       6767;
        server_name  localhost;

        location / {
            root   "D:/Kuliah/Semester 4/TekPlat/Gemini CLI/Tubes-Tekplat";
            index  index.html index.htm;
        }

        # Log untuk debugging
        access_log  "D:/Kuliah/Semester 4/TekPlat/Gemini CLI/Tubes-Tekplat/access.log";
        error_log   "D:/Kuliah/Semester 4/TekPlat/Gemini CLI/Tubes-Tekplat/error.log";
    }
}