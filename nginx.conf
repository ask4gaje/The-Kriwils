events {
    worker_connections 1024;
}

http {
    # Pastikan mime.types tersedia atau definisikan dasar-dasarnya
    types {
        text/html                             html htm shtml;
        text/css                              css;
        application/javascript                js;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        image/png                             png;
        image/svg+xml                         svg svgz;
    }

    server {
        listen       6767;
        server_name  localhost;

        location / {
            root   "D:/Kuliah/Semester 4/TekPlat/Gemini CLI/The-Kriwils/public";
            index  login.html index.html index.htm;
            
            # Pretty URL rewrite for play/ID
            rewrite ^/play/(.*)$ /play.html last;
        }

        # Log untuk debugging
        access_log  "D:/Kuliah/Semester 4/TekPlat/Gemini CLI/The-Kriwils/access.log";
        error_log   "D:/Kuliah/Semester 4/TekPlat/Gemini CLI/The-Kriwils/error.log";
    }
}