<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Kriwils</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f0f0;">
    <div style="background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center;">
        <h2>The Kriwils Login</h2>
        <input type="text" placeholder="Username" style="width: 100%; margin-bottom: 10px; padding: 10px;"><br>
        <input type="password" placeholder="Password" style="width: 100%; margin-bottom: 20px; padding: 10px;"><br>
        <button id="doLogin" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Login</button>
    </div>

    <script>
        document.getElementById('doLogin').onclick = function() {
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
