        <main>
            <div id="loading" class="loading-wrapper">
                <div class="spinner"></div>
                <p>Loading your quiz...</p>
            </div>

            <h1 id="quizTitleDisplay" class="quiz-title-display hidden"></h1>

        <!-- Already Played Message -->
        <div id="alreadyPlayed" class="quiz-container hidden">
            <h2 class="already-played-heading">Quiz Already Completed</h2>
            <p class="already-played-text">This quiz does not allow replays. You have already submitted your score for this session.</p>
            <button onclick="window.location.href='/create'">Back to Home</button>
        </div>

        <!-- Pre-Quiz: Name Prompt -->
        <div id="namePrompt" class="quiz-container hidden">
            <h2 class="name-prompt-heading">Ready to Play?</h2>
            <p class="name-prompt-text">Please enter your name to start the quiz and save your score.</p>
            <form id="playerNameForm" autocomplete="on">
            <div class="form-group">
                <input type="text" id="playerName" placeholder="Your Name" class="name-prompt-input" autocomplete="name">
                <button type="submit" onclick="startQuiz()">Start Quiz</button>
            </div>
            </form>
        </div>

        <!-- Main Quiz -->
        <div id="quizApp" class="quiz-container hidden">
            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>
            <p id="questionCounter" class="question-counter"></p>

            <div id="questionArea" aria-live="polite">
                <h2 id="questionText" class="question-text"></h2>
                <div id="optionsGrid" class="options-grid"></div>
            </div>
        </div>

        <!-- Final Results -->
        <div id="resultsArea" class="quiz-container results-card hidden">
            <h1>Quiz Complete!</h1>
            <p>You've finished the quiz. Here's how you did:</p>
            <div class="score-circle" id="finalScore">0/0</div>
            <p id="feedbackText" class="feedback-text"></p>
            <div class="results-actions">
                <button id="replayBtn" onclick="location.reload()">Try Again</button>
                <button id="reviewBtn" onclick="showReview()" class="btn-review hidden">Review Answers</button>
                <button onclick="window.location.href='/create'" class="btn-muted">Back to Home</button>
            </div>
        </div>

        <!-- Review Area -->
        <div id="reviewArea" class="quiz-container hidden">
            <h1 class="review-heading">Review Answers</h1>
            <div id="reviewList" class="review-list"></div>
            <button onclick="hideReview()" class="btn-back-to-results">Back to Results</button>
        </div>
    </main>
    </div>

    <script src="js/auth.js?v=2.0"></script>
    <script src="js/play.js?v=2.0"></script>
    <script>
        document.getElementById('playerNameForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.querySelector('#playerNameForm button').click();
        });
    </script>
