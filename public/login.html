<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Kriwils</title>
    <link rel="stylesheet" href="css/style.css?v=1.4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-brand">The Kriwils</a>
        <ul class="nav-links">
            <!-- Dynamically populated by auth.js -->
        </ul>
    </nav>
    <div class="login-container">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p>Please enter your details to sign in</p>
            <div id="errorMsg" style="color: #dc2626; font-size: 0.875rem; margin-bottom: 1rem; text-align: center; display: none;"></div>
            <div id="resendMsg" style="color: #059669; font-size: 0.8125rem; margin-bottom: 1rem; text-align: center; display: none;"></div>
            <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button type="submit" id="doLogin">Sign In</button>
            </form>
            <p style="margin-top: 1rem; font-size: 0.8125rem; text-align: center;">
                <a href="resetpassword.html" style="color: var(--text-muted); text-decoration: underline;">Forgot password?</a>
            </p>
            <p style="margin-top: 0.5rem; font-size: 0.875rem;">Don't have an account? <a href="register.html" style="color: var(--primary-color); text-decoration: none;">Sign Up</a></p>
        </div>
    </div>

    <script src="js/auth.js?v=1.4"></script>
    <script>
        const UNCONFIRMED_MSGS = ['email not confirmed', 'email not verified', 'unconfirmed', 'not confirmed'];

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('doLogin').click();
        });

        document.getElementById('doLogin').onclick = async function() {
            const email = document.getElementById('email').value.trim();
            const pwd = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            const resendMsg = document.getElementById('resendMsg');
            const loginBtn = document.getElementById('doLogin');

            resendMsg.style.display = 'none';

            if (!email || !pwd) {
                errorDiv.innerText = "Please fill in all fields.";
                errorDiv.style.display = "block";
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerText = "Signing In...";
            errorDiv.style.display = "none";

            try {
                const { data, error } = await loginUser(email, pwd);
                if (error) {
                    const lowerMsg = error.message.toLowerCase();
                    const isUnconfirmed = UNCONFIRMED_MSGS.some(m => lowerMsg.includes(m));
                    if (isUnconfirmed) {
                        errorDiv.innerHTML = `Your email hasn't been verified yet. <a href="#" id="resendLink" style="color: var(--primary-color); text-decoration: underline;">Resend confirmation email</a>`;
                        errorDiv.style.display = "block";
                        document.getElementById('resendLink').onclick = async function(e) {
                            e.preventDefault();
                            try {
                                await resendConfirmationEmail(email);
                                resendMsg.innerText = "Confirmation email resent! Check your inbox.";
                                resendMsg.style.display = "block";
                                errorDiv.style.display = "none";
                            } catch (resendErr) {
                                errorDiv.innerHTML = resendErr.message;
                                errorDiv.style.display = "block";
                            }
                        };
                    } else {
                        errorDiv.innerText = error.message;
                        errorDiv.style.display = "block";
                    }
                } else {
                    window.location.href = 'index.html';
                }
            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.style.display = "block";
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerText = "Sign In";
            }
        };
    </script>
</body>
</html>
