<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 36'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M8 10C8 6 11 2 16 2C21 2 24 6 24 10C24 14 22 17 18 19L17 20V24' stroke='url(%23g)' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='17' cy='31' r='2.5' fill='url(%23g)'/%3E%3C/svg%3E">
    <title>Login - The Kriwils</title>
    <link rel="stylesheet" href="css/style.css?v=2.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
</head>
<body>
    <div class="auth-split-layout">
        <div class="auth-splash"></div>
        <div class="auth-form-side">
            <div class="login-card">
                <h1>Welcome Back</h1>
                <p>Please enter your details to log in</p>
                <div id="errorMsg" class="message-error" role="alert"></div>
                <div id="resendMsg" class="message-success message-sm" role="alert"></div>
                <form id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="doLogin">Login</button>
                </form>
                <p class="login-footer-link"><a href="/resetpassword">Forgot password?</a></p>
                <p class="login-footer-link">Don't have an account? <a href="/register">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js?v=2.0"></script>
    <script>
        renderAuthSplash('');

        const UNCONFIRMED_MSGS = ['email not confirmed', 'email not verified', 'unconfirmed', 'not confirmed'];

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('doLogin').click();
        });

        document.getElementById('doLogin').onclick = async function() {
            const email = document.getElementById('email').value.trim();
            const pwd = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            const resendMsg = document.getElementById('resendMsg');
            const loginBtn = document.getElementById('doLogin');

            resendMsg.style.display = 'none';

            if (!email || !pwd) {
                errorDiv.innerText = "Please fill in all fields.";
                errorDiv.style.display = "block";
                return;
            }

            loginBtn.disabled = true;
            setButtonLoading(loginBtn, 'Signing In...');
            errorDiv.style.display = "none";

            try {
                const { data, error } = await loginUser(email, pwd);
                if (error) {
                    const lowerMsg = error.message.toLowerCase();
                    const isUnconfirmed = UNCONFIRMED_MSGS.some(m => lowerMsg.includes(m));
                    if (isUnconfirmed) {
                        errorDiv.innerHTML = `Your email hasn't been verified yet. <a href="#" id="resendLink" class="inline-link">Resend confirmation email</a>`;
                        errorDiv.style.display = "block";
                        document.getElementById('resendLink').onclick = async function(e) {
                            e.preventDefault();
                            try {
                                await resendConfirmationEmail(email);
                                resendMsg.innerText = "Confirmation email resent! Check your inbox.";
                                resendMsg.style.display = "block";
                                errorDiv.style.display = "none";
                            } catch (resendErr) {
                                errorDiv.innerHTML = humanizeError(resendErr);
                                errorDiv.style.display = "block";
                            }
                        };
                    } else {
                        errorDiv.innerText = humanizeError(error);
                        errorDiv.style.display = "block";
                    }
                } else {
                    window.location.href = '/create';
                }
            } catch (err) {
                errorDiv.innerText = humanizeError(err);
                errorDiv.style.display = "block";
            } finally {
                resetButton(loginBtn, 'Login');
            }
        };
    </script>
    <script src="js/splash-constellations.js"></script>
</body>
</html>
