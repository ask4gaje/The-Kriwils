                    <h2>Play a Quiz</h2>
                    <p>Have a code from your teacher or friend? Enter it below and join the game instantly.</p>

                    <div class="join-input-wrapper">
                        <label for="joinQuizCode" class="join-input-label">Quiz Code</label>
                        <input type="text" id="joinQuizCode" class="join-input-large" placeholder="KRIWIL" maxlength="6" autocomplete="off">

    <script src="js/auth.js?v=2.0"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const joinBtn = document.getElementById('joinBtn');
            const joinInput = document.getElementById('joinQuizCode');

            if (joinBtn && joinInput) {
                joinBtn.onclick = () => {
                    const code = joinInput.value.trim().toUpperCase();
                    if (code.length === 6) {
                        window.location.href = `/play/${code}`;
                    } else {
                        if (typeof showToast === 'function') {
                            showToast("Please enter a valid 6-character code!", 'error');
                        } else {
                            alert("Please enter a valid 6-character code!");
                        }
                    }
                };

                joinInput.onkeypress = (e) => {
                    if (e.key === 'Enter') joinBtn.click();
                };
            }
        });
    </script>
