<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - The Kriwils</title>
    <link rel="stylesheet" href="css/style.css?v=1.6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
</head>
<body>
    <nav aria-label="Main navigation">
        <a href="/create" class="nav-brand">The Kriwils</a>
        <ul class="nav-links">
            <!-- Dynamically populated by auth.js -->
        </ul>
    </nav>
    <div class="login-container">
        <div class="login-card">
            <h2>Create Account</h2>
            <p>Join The Kriwils today</p>
            <div id="errorMsg" class="message-error"></div>
            <div id="successMsg" class="message-success"></div>
            <div id="resendMsg" class="message-success message-sm"></div>
            <form id="registerForm">
            <div class="form-group">
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="regDisplayName">Display Name</label>
                <input type="text" id="regDisplayName" placeholder="How others will see you" autocomplete="name">
            </div>
            <div class="form-group">
                <label for="regPassword">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="regPassword" placeholder="Create a password" autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('regPassword', this)">Show</button>
                </div>
            </div>
            <button type="submit" id="doRegister">Sign Up</button>
            </form>
            <p class="login-footer-link">Already have an account? <a href="/login">Sign In</a></p>
        </div>
    </div>

    <script src="js/auth.js?v=1.6"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('doRegister').click();
        });

        document.getElementById('doRegister').onclick = async function() {
            const email = document.getElementById('regEmail').value.trim();
            const displayName = document.getElementById('regDisplayName').value.trim();
            const pwd = document.getElementById('regPassword').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            const resendMsg = document.getElementById('resendMsg');
            const regBtn = document.getElementById('doRegister');

            if (!email || !displayName || !pwd) {
                errorDiv.innerText = "All fields are required.";
                errorDiv.style.display = "block";
                return;
            }

            regBtn.disabled = true;
            regBtn.innerText = "Creating Account...";
            errorDiv.style.display = "none";
            successDiv.style.display = "none";
            resendMsg.style.display = "none";

            try {
                const { data, error } = await registerUser(email, pwd, displayName);
                if (error) {
                    errorDiv.innerText = error.message;
                    errorDiv.style.display = "block";
                } else if (!data.session && data.user) {
                    const isNew = Date.now() - new Date(data.user.created_at).getTime() < 10000;
                    if (!isNew) {
                        errorDiv.innerText = "An account with this email already exists. Check your inbox or reset your password.";
                        errorDiv.style.display = "block";
                    } else {
                        successDiv.style.color = '#d97706';
                        successDiv.innerHTML = 'A confirmation email has been sent. '
                            + '<strong>You must verify your email before signing in.</strong>'
                            + '<br><a href="#" id="resendRegLink" class="inline-link">Resend confirmation email</a>';
                        successDiv.style.display = "block";
                        regBtn.style.display = "none";
                        document.getElementById('resendRegLink').onclick = async function(e) {
                            e.preventDefault();
                            try {
                                await resendConfirmationEmail(email);
                                resendMsg.innerText = "Confirmation email resent! Check your inbox.";
                                resendMsg.style.display = "block";
                            } catch (resendErr) {
                                resendMsg.innerText = resendErr.message;
                                resendMsg.style.display = "block";
                            }
                        };
                    }
                } else {
                        successDiv.style.color = '#059669';
                        successDiv.innerText = "Account created! You can now log in.";
                        successDiv.style.display = "block";
                        setTimeout(() => {
                            window.location.href = '/login';
                        }, 2000);
                    }
            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.style.display = "block";
            } finally {
                regBtn.disabled = false;
                regBtn.innerText = "Sign Up";
            }
        };
    </script>
</body>
</html>
