<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - The Kriwils</title>
    <link rel="stylesheet" href="css/style.css?v=1.4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-brand">The Kriwils</a>
        <ul class="nav-links">
            <!-- Dynamically populated by auth.js -->
        </ul>
    </nav>
    <div class="login-container">
        <div class="login-card">
            <h2>Create Account</h2>
            <p>Join The Kriwils today</p>
            <div id="errorMsg" style="color: #dc2626; font-size: 0.875rem; margin-bottom: 1rem; text-align: center; display: none;"></div>
            <div id="successMsg" style="color: #059669; font-size: 0.875rem; margin-bottom: 1rem; text-align: center; display: none;"></div>
            <div id="resendMsg" style="color: #059669; font-size: 0.8125rem; margin-bottom: 1rem; text-align: center; display: none;"></div>
            <form id="registerForm">
            <div class="form-group">
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="regDisplayName">Display Name (optional)</label>
                <input type="text" id="regDisplayName" placeholder="How others will see you">
            </div>
            <div class="form-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" placeholder="••••••••">
            </div>
            <button type="submit" id="doRegister">Sign Up</button>
            </form>
            <p style="margin-top: 1.5rem; font-size: 0.875rem;">Already have an account? <a href="login.html" style="color: var(--primary-color); text-decoration: none;">Sign In</a></p>
        </div>
    </div>

    <script src="js/auth.js?v=1.4"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('doRegister').click();
        });

        document.getElementById('doRegister').onclick = async function() {
            const email = document.getElementById('regEmail').value.trim();
            const displayName = document.getElementById('regDisplayName').value.trim();
            const pwd = document.getElementById('regPassword').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            const resendMsg = document.getElementById('resendMsg');
            const regBtn = document.getElementById('doRegister');

            if (!email || !pwd) {
                errorDiv.innerText = "Email and password are required.";
                errorDiv.style.display = "block";
                return;
            }

            regBtn.disabled = true;
            regBtn.innerText = "Creating Account...";
            errorDiv.style.display = "none";
            successDiv.style.display = "none";
            resendMsg.style.display = "none";

            try {
                const { data, error } = await registerUser(email, pwd, displayName);
                if (error) {
                    errorDiv.innerText = error.message;
                    errorDiv.style.display = "block";
                } else {
                    const needsConfirmation = !data.session;
                    if (needsConfirmation) {
                        successDiv.style.color = '#d97706';
                        successDiv.innerHTML = 'A confirmation email has been sent. '
                            + '<strong>You must verify your email before signing in.</strong>'
                            + '<br><a href="#" id="resendRegLink" style="color: var(--primary-color); text-decoration: underline;">Resend confirmation email</a>';
                        successDiv.style.display = "block";
                        regBtn.style.display = "none";
                        document.getElementById('resendRegLink').onclick = async function(e) {
                            e.preventDefault();
                            try {
                                await resendConfirmationEmail(email);
                                resendMsg.innerText = "Confirmation email resent! Check your inbox.";
                                resendMsg.style.display = "block";
                            } catch (resendErr) {
                                resendMsg.innerText = resendErr.message;
                                resendMsg.style.display = "block";
                            }
                        };
                    } else {
                        successDiv.style.color = '#059669';
                        successDiv.innerText = "Account created! You can now log in.";
                        successDiv.style.display = "block";
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2000);
                    }
                }
            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.style.display = "block";
            } finally {
                regBtn.disabled = false;
                regBtn.innerText = "Sign Up";
            }
        };
    </script>
</body>
</html>
