<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - The Kriwils</title>
    <link rel="stylesheet" href="css/style.css?v=1.4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-brand">The Kriwils</a>
        <ul class="nav-links">
            <!-- Dynamically populated by auth.js -->
        </ul>
    </nav>
    <div class="login-container">
        <div class="login-card">
            <h2>Create Account</h2>
            <p>Join The Kriwils today</p>
            <div id="errorMsg" style="color: #dc2626; font-size: 0.875rem; margin-bottom: 1rem; text-align: center; display: none;"></div>
            <div class="form-group">
                <label for="regUsername">Username</label>
                <input type="text" id="regUsername" placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" placeholder="••••••••">
            </div>
            <button id="doRegister">Sign Up</button>
            <p style="margin-top: 1.5rem; font-size: 0.875rem;">Already have an account? <a href="login.html" style="color: var(--primary-color); text-decoration: none;">Sign In</a></p>
        </div>
    </div>

    <script src="js/auth.js?v=1.4"></script>
    <script>
        document.getElementById('doRegister').onclick = async function() {
            const usn = document.getElementById('regUsername').value.trim();
            const pwd = document.getElementById('regPassword').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            const regBtn = document.getElementById('doRegister');

            if (!usn || !pwd) {
                errorDiv.innerText = "Please fill in all fields.";
                errorDiv.style.display = "block";
                return;
            }

            regBtn.disabled = true;
            regBtn.innerText = "Creating Account...";
            errorDiv.style.display = "none";

            try {
                const { data, error } = await registerUser(usn, pwd);
                if (error) {
                    errorDiv.innerText = error.message;
                    errorDiv.style.display = "block";
                } else {
                    showToast("Registration successful! You can now log in.", 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                }
            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.style.display = "block";
            } finally {
                regBtn.disabled = false;
                regBtn.innerText = "Sign Up";
            }
        };
    </script>
</body>
</html>
