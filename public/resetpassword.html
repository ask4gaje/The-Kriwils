<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 36'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M8 10C8 6 11 2 16 2C21 2 24 6 24 10C24 14 22 17 18 19L17 20V24' stroke='url(%23g)' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='17' cy='31' r='2.5' fill='url(%23g)'/%3E%3C/svg%3E">
    <title>Reset Password - The Kriwils</title>
    <link rel="stylesheet" href="css/style.css?v=2.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
</head>
<body>
    <div class="auth-split-layout">
        <div class="auth-splash"></div>
        <div class="auth-form-side">
            <div class="login-card">
                <h1>Reset Password</h1>
                <p>Enter your email and we'll send you a reset link</p>
                <div id="errorMsg" class="message-error" role="alert"></div>
                <div id="successMsg" class="message-success" role="alert"></div>
                <form id="resetForm" autocomplete="on">
                <div class="form-group">
                    <label for="resetEmail">Email</label>
                    <input type="email" id="resetEmail" placeholder="Your account email" autocomplete="email" required>
                </div>
                <button type="submit" id="doReset">Send Reset Link</button>
                </form>
                <p class="login-footer-link">
                    <a href="/login">Back to Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/auth.js?v=2.0"></script>
    <script>
        renderAuthSplash('Reset your password securely');

        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('doReset').click();
        });

        document.getElementById('doReset').onclick = async function() {
            const email = document.getElementById('resetEmail').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            const btn = document.getElementById('doReset');

            if (!email) {
                errorDiv.innerText = "Please enter your email address.";
                errorDiv.style.display = "block";
                return;
            }

            btn.disabled = true;
            setButtonLoading(btn, 'Sending...');
            errorDiv.style.display = "none";
            successDiv.style.display = "none";

            try {
                await resetPassword(email);
                successDiv.innerText = "If an account exists with that email, a reset link has been sent. Check your inbox.";
                successDiv.style.display = "block";
            } catch (err) {
                errorDiv.innerText = humanizeError(err);
                errorDiv.style.display = "block";
            } finally {
                resetButton(btn, 'Send Reset Link');
            }
        };
    </script>
<script src="js/splash-constellations.js"></script>
</body>
</html>
