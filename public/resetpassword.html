<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - The Kriwils</title>
    <link rel="stylesheet" href="css/style.css?v=1.6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
</head>
<body>
    <nav aria-label="Main navigation">
        <a href="/create" class="nav-brand">The Kriwils</a>
        <ul class="nav-links">
            <!-- Dynamically populated by auth.js -->
        </ul>
    </nav>
    <div class="login-container">
        <div class="login-card">
            <h2>Reset Password</h2>
            <p>Enter your email and we'll send you a reset link</p>
            <div id="errorMsg" class="message-error"></div>
            <div id="successMsg" class="message-success"></div>
            <form id="resetForm">
            <div class="form-group">
                <label for="resetEmail">Email</label>
                <input type="email" id="resetEmail" placeholder="Your account email" autocomplete="email">
            </div>
            <button type="submit" id="doReset">Send Reset Link</button>
            </form>
            <p class="login-footer-link">
                <a href="/login">Back to Login</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js?v=1.6"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('doReset').click();
        });

        document.getElementById('doReset').onclick = async function() {
            const email = document.getElementById('resetEmail').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            const btn = document.getElementById('doReset');

            if (!email) {
                errorDiv.innerText = "Please enter your email address.";
                errorDiv.style.display = "block";
                return;
            }

            btn.disabled = true;
            btn.innerText = "Sending...";
            errorDiv.style.display = "none";
            successDiv.style.display = "none";

            try {
                await resetPassword(email);
                successDiv.innerText = "If an account exists with that email, a reset link has been sent. Check your inbox.";
                successDiv.style.display = "block";
            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.innerText = "Send Reset Link";
            }
        };
    </script>
</body>
</html>
