<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 36'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M8 10C8 6 11 2 16 2C21 2 24 6 24 10C24 14 22 17 18 19L17 20V24' stroke='url(%23g)' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='17' cy='31' r='2.5' fill='url(%23g)'/%3E%3C/svg%3E">
    <title>The Kriwils - Home</title>
    <link rel="stylesheet" href="css/style.css?v=2.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body class="body-hidden">
    <nav aria-label="Main navigation">
        <a href="/create" class="nav-brand brand-logo">
            <svg class="brand-logo-nav" viewBox="0 0 32 36" fill="none" aria-hidden="true">
                <defs>
                    <linearGradient id="logoGradA" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#6366f1"/>
                        <stop offset="100%" stop-color="#4f46e5"/>
                    </linearGradient>
                </defs>
                <path d="M8 10C8 6 11 2 16 2C21 2 24 6 24 10C24 14 22 17 18 19L17 20V24"
                      stroke="url(#logoGradA)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <circle cx="17" cy="31" r="2.5" fill="url(#logoGradA)"/>
            </svg>
            The Kriwils
        </a>
        <ul class="nav-links">
            <!-- Dynamically populated by auth.js -->
        </ul>
    </nav>


    <main>
        <section class="quiz-generator">
            <h1>Create a Custom Quiz</h1>
            <p>Enter any topic and choose a difficulty to get started.</p>

            
            <form class="generator-form" autocomplete="off">
                <div class="form-group">
                    <label for="quizTitle">Quiz Title</label>
                    <input type="text" id="quizTitle" placeholder="e.g., My Awesome Retro Quiz" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="quizTopic">Topic</label>
                    <input type="text" id="quizTopic" placeholder="e.g., Space Exploration, 80s Rock, Quantum Physics" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="pdfUpload">Upload Reference Material (Optional PDF)</label>
                    <div class="drop-zone" id="pdfDropZone">
                        <input type="file" id="pdfUpload" accept="application/pdf" hidden>
                        <div class="drop-zone-content" id="dropZoneContent">
                            <span class="drop-zone-icon">+</span>
                            <p class="drop-zone-text">Drop PDF here or click to browse</p>
                            <p class="drop-zone-hint">Max 50 pages. Content will be converted to Indonesian.</p>
                        </div>
                        <div class="drop-zone-file hidden" id="dropZoneFile">
                            <span class="drop-zone-file-name" id="dzFileName"></span>
                            <span class="drop-zone-file-size" id="dzFileSize"></span>
                            <button type="button" class="drop-zone-remove" id="dzRemove">x</button>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="quizDifficulty">Difficulty</label>
                    <select id="quizDifficulty">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quizCount">Number of Questions</label>
                    <select id="quizCount">
                        <option value="5" selected>5 Questions</option>
                        <option value="10">10 Questions</option>
                        <option value="20">20 Questions</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quizTimeLimit">Time per Question</label>
                    <select id="quizTimeLimit">
                        <option value="0" selected>No Limit</option>
                        <option value="10">10 seconds</option>
                        <option value="15">15 seconds</option>
                        <option value="30">30 seconds</option>
                        <option value="60">60 seconds</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="isReplayable"> Allow students to replay this quiz
                    </label>
                    <label>
                        <input type="checkbox" id="isReviewable" checked> Allow students to review answers and explanations
                    </label>
                </div>
                
                <button id="generateBtn" type="submit">Generate Quiz</button>
            </form>

            <div id="quizResults" class="quiz-results" aria-live="polite">
            </div>
        </section>
    </main>
    <script src="js/auth.js?v=2.0"></script>
    <script src="js/script.js?v=2.0"></script>
</body>
</html>
