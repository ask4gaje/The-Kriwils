        <main class="create-main">
            <section class="quiz-generator">
                <h1>Create a Custom Quiz</h1>
                <p>Enter any topic and choose a difficulty to get started.</p>


                <form class="generator-form" autocomplete="off">
                    <div class="form-group">
                        <label for="quizTitle">Quiz Title</label>
                        <input type="text" id="quizTitle" placeholder="e.g., My Awesome Retro Quiz" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="quizTopic">Topic</label>
                        <input type="text" id="quizTopic" placeholder="e.g., Space Exploration, 80s Rock, Quantum Physics" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="pdfUpload">Upload Reference Material (Optional PDF)</label>
                        <div class="drop-zone" id="pdfDropZone">
                            <input type="file" id="pdfUpload" accept="application/pdf" hidden>
                            <div class="drop-zone-content" id="dropZoneContent">
                                <span class="drop-zone-icon">+</span>
                                <p class="drop-zone-text">Drop PDF here or click to browse</p>
                                <p class="drop-zone-hint">Max 50 pages. Content will be converted to Indonesian.</p>
                            </div>
                            <div class="drop-zone-file hidden" id="dropZoneFile">
                                <span class="drop-zone-file-name" id="dzFileName"></span>
                                <span class="drop-zone-file-size" id="dzFileSize"></span>
                                <button type="button" class="drop-zone-remove" id="dzRemove">x</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="quizDifficulty">Difficulty</label>
                        <select id="quizDifficulty">
                            <option value="easy">Easy</option>
                            <option value="medium" selected>Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="quizCount">Number of Questions</label>
                        <select id="quizCount">
                            <option value="5" selected>5 Questions</option>
                            <option value="10">10 Questions</option>
                            <option value="20">20 Questions</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="quizTimeLimit">Time per Question</label>
                        <select id="quizTimeLimit">
                            <option value="0" selected>No Limit</option>
                            <option value="10">10 seconds</option>
                            <option value="15">15 seconds</option>
                            <option value="30">30 seconds</option>
                            <option value="60">60 seconds</option>
                        </select>
                    </div>

                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="isReplayable"> Allow students to replay this quiz
                        </label>
                        <label>
                            <input type="checkbox" id="isReviewable" checked> Allow students to review answers and explanations
                        </label>
                    </div>

                    <button id="generateBtn" type="submit">Generate Quiz</button>
                </form>

                <div id="quizResults" class="quiz-results" aria-live="polite">
                </div>
            </section>
