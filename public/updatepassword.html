<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - The Kriwils</title>
    <link rel="stylesheet" href="css/style.css?v=1.5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
</head>
<body>
    <nav aria-label="Main navigation">
        <a href="/index" class="nav-brand">The Kriwils</a>
        <ul class="nav-links">
            <!-- Dynamically populated by auth.js -->
        </ul>
    </nav>
    <div class="login-container">
        <div class="login-card" id="recoveryCard">
            <h2>Set New Password</h2>
            <p>Choose a new password for your account</p>
            <div id="errorMsg" class="message-error"></div>
            <div id="successMsg" class="message-success"></div>
            <form id="recoveryForm">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('newPassword', this)">Show</button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Re-enter new password" autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirmPassword', this)">Show</button>
                </div>
            </div>
            <button type="submit" id="doUpdate">Update Password</button>
            </form>
            <p class="login-footer-link">
                <a href="/login">Back to Login</a>
            </p>
        </div>
    </div>

    <script src="js/auth.js?v=1.5"></script>
    <script>
        (async function() {
            document.getElementById('recoveryForm').addEventListener('submit', function(e) {
                e.preventDefault();
                document.getElementById('doUpdate').click();
            });

            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            const btn = document.getElementById('doUpdate');
            const card = document.getElementById('recoveryCard');

            const client = await getSupabase();
            if (!client) {
                errorDiv.innerText = 'Could not connect to service. Please refresh.';
                errorDiv.style.display = 'block';
                return;
            }

            const hash = window.location.hash;
            if (!hash || !hash.includes('type=recovery')) {
                card.innerHTML = '<h2>Invalid Link</h2><p>This page is for resetting your password via email. <a href="/resetpassword" class="inline-link">Request a new reset link</a>.</p>';
                return;
            }

            const { data: { session } } = await client.auth.getSession();
            if (!session) {
                card.innerHTML = '<h2>Link Expired</h2><p>This password reset link has expired or is invalid. <a href="/resetpassword" class="inline-link">Request a new reset link</a>.</p>';
                return;
            }

            document.getElementById('doUpdate').onclick = async function() {
                const newPwd = document.getElementById('newPassword').value.trim();
                const confirmPwd = document.getElementById('confirmPassword').value.trim();

                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';

                if (!newPwd || !confirmPwd) {
                    errorDiv.innerText = 'Please fill in all fields.';
                    errorDiv.style.display = 'block';
                    return;
                }
                if (newPwd !== confirmPwd) {
                    errorDiv.innerText = 'Passwords do not match.';
                    errorDiv.style.display = 'block';
                    return;
                }
                if (newPwd.length < 6) {
                    errorDiv.innerText = 'Password must be at least 6 characters.';
                    errorDiv.style.display = 'block';
                    return;
                }

                btn.disabled = true;
                btn.innerText = 'Updating...';

                try {
                    await setPasswordFromRecovery(newPwd);
                    successDiv.innerText = 'Password updated successfully! Redirecting to login...';
                    successDiv.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } catch (err) {
                    errorDiv.innerText = err.message;
                    errorDiv.style.display = 'block';
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'Update Password';
                }
            };
        })();
    </script>
</body>
</html>
