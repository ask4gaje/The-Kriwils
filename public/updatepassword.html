<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 36'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M8 10C8 6 11 2 16 2C21 2 24 6 24 10C24 14 22 17 18 19L17 20V24' stroke='url(%23g)' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='17' cy='31' r='2.5' fill='url(%23g)'/%3E%3C/svg%3E">
    <title>Set New Password - The Kriwils</title>
    <link rel="stylesheet" href="css/style.css?v=2.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
</head>
<body>
    <div class="auth-split-layout">
        <div class="auth-splash"></div>
        <div class="auth-form-side">
            <div class="login-card" id="recoveryCard">
                <h1>Set New Password</h1>
                <p>Choose a new password for your account</p>
                <div id="errorMsg" class="message-error" role="alert"></div>
                <div id="successMsg" class="message-success" role="alert"></div>
                <form id="recoveryForm" autocomplete="on">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter new password" autocomplete="new-password" required>
                </div>
                <button type="submit" id="doUpdate">Update Password</button>
                </form>
                <p class="login-footer-link">
                    <a href="/login">Back to Login</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/auth.js?v=2.0"></script>
    <script>
        renderAuthSplash('Set a new password for your account');

        (async function() {
            document.getElementById('recoveryForm').addEventListener('submit', function(e) {
                e.preventDefault();
                document.getElementById('doUpdate').click();
            });

            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            const btn = document.getElementById('doUpdate');
            const card = document.getElementById('recoveryCard');

            const client = await getSupabase();
            if (!client) {
                errorDiv.innerText = 'Could not connect to service. Please refresh.';
                errorDiv.style.display = 'block';
                return;
            }

            const hash = window.location.hash;
            if (!hash || !hash.includes('type=recovery')) {
                card.innerHTML = '<h1>Invalid Link</h1><p>This page is for resetting your password via email. <a href="/resetpassword" class="inline-link">Request a new reset link</a>.</p>';
                return;
            }

            const { data: { session } } = await client.auth.getSession();
            if (!session) {
                card.innerHTML = '<h1>Link Expired</h1><p>This password reset link has expired or is invalid. <a href="/resetpassword" class="inline-link">Request a new reset link</a>.</p>';
                return;
            }

            document.getElementById('doUpdate').onclick = async function() {
                const newPwd = document.getElementById('newPassword').value.trim();
                const confirmPwd = document.getElementById('confirmPassword').value.trim();

                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';

                if (!newPwd || !confirmPwd) {
                    errorDiv.innerText = 'Please fill in all fields.';
                    errorDiv.style.display = 'block';
                    return;
                }
                if (newPwd !== confirmPwd) {
                    errorDiv.innerText = 'Passwords do not match.';
                    errorDiv.style.display = 'block';
                    return;
                }
                if (newPwd.length < 6) {
                    errorDiv.innerText = 'Password must be at least 6 characters.';
                    errorDiv.style.display = 'block';
                    return;
                }

                btn.disabled = true;
                setButtonLoading(btn, 'Updating...');

                try {
                    await setPasswordFromRecovery(newPwd);
                    successDiv.innerText = 'Password updated successfully! Redirecting to login...';
                    successDiv.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } catch (err) {
                    errorDiv.innerText = humanizeError(err);
                    errorDiv.style.display = 'block';
                } finally {
                    resetButton(btn, 'Update Password');
                }
            };
        })();
    </script>
<script src="js/splash-constellations.js"></script>
</body>
</html>
