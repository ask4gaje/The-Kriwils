<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Kriwils - Home</title>
    <link rel="stylesheet" href="css/style.css?v=1.1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="#" onclick="logoutUser()">Logout</a></li>
        </ul>
    </nav>

    <main>
        <section class="quiz-generator">
            <h1>Create a Custom Quiz</h1>
            <p>Enter any topic and choose a difficulty to get started.</p>
            
            <div class="generator-form">
                <div class="form-group">
                    <label for="quizTopic">Topic</label>
                    <input type="text" id="quizTopic" placeholder="e.g., Space Exploration, 80s Rock, Quantum Physics">
                </div>
                
                <div class="form-group">
                    <label for="quizDifficulty">Difficulty</label>
                    <select id="quizDifficulty">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
                
                <button id="generateBtn">Generate Quiz</button>
            </div>

            <div id="quizResults" class="quiz-results" style="display:none;">
                <!-- Results will appear here -->
            </div>
        </section>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
