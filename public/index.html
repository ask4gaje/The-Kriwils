<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Kriwils - Home</title>
    <link rel="stylesheet" href="css/style.css?v=1.2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-brand">The Kriwils</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="quizzes.html">Quiz</a></li>
            <li><a href="about.html">About</a></li>
            <li><button onclick="logoutUser()" class="btn-logout">Logout</button></li>
        </ul>
    </nav>

    <main>
        <section class="quiz-generator">
            <h1>Create a Custom Quiz</h1>
            <p>Enter any topic and choose a difficulty to get started.</p>
            
            <div class="generator-form">
                <div class="form-group">
                    <label for="quizTitle">Quiz Title</label>
                    <input type="text" id="quizTitle" placeholder="e.g., My Awesome Retro Quiz">
                </div>

                <div class="form-group">
                    <label for="quizTopic">Topic</label>
                    <input type="text" id="quizTopic" placeholder="e.g., Space Exploration, 80s Rock, Quantum Physics">
                </div>

                <div class="form-group">
                    <label for="pdfUpload">Upload Reference Material (Optional PDF)</label>
                    <input type="file" id="pdfUpload" accept="application/pdf" style="padding: 0.5rem; background: #f9fafb;">
                    <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">Max 50 pages. Content will be converted to Indonesian.</small>
                </div>
                
                <div class="form-group">
                    <label for="quizDifficulty">Difficulty</label>
                    <select id="quizDifficulty">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quizCount">Number of Questions</label>
                    <select id="quizCount">
                        <option value="5" selected>5 Questions</option>
                        <option value="10">10 Questions</option>
                        <option value="20">20 Questions</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="isReplayable"> Allow students to replay this quiz
                    </label>
                    <label>
                        <input type="checkbox" id="isReviewable" checked> Allow students to review answers and explanations
                    </label>
                </div>
                
                <button id="generateBtn">Generate Quiz</button>
            </div>

            <div id="quizResults" class="quiz-results" style="display:none;">
                <!-- Results will appear here -->
            </div>
        </section>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/script.js?v=1.2"></script>
</body>
</html>
