<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Kriwils - Home</title>
    <link rel="stylesheet" href="css/style.css?v=1.2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-brand">The Kriwils</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><button onclick="logoutUser()" class="btn-logout">Logout</button></li>
        </ul>
    </nav>

    <main>
        <section class="quiz-generator">
            <h1>Create a Custom Quiz</h1>
            <p>Enter any topic and choose a difficulty to get started.</p>
            
            <div class="generator-form">
                <div class="form-group">
                    <label for="quizTitle">Quiz Title</label>
                    <input type="text" id="quizTitle" placeholder="e.g., My Awesome Retro Quiz">
                </div>

                <div class="form-group">
                    <label for="quizTopic">Topic</label>
                    <input type="text" id="quizTopic" placeholder="e.g., Space Exploration, 80s Rock, Quantum Physics">
                </div>
                
                <div class="form-group">
                    <label for="quizDifficulty">Difficulty</label>
                    <select id="quizDifficulty">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quizCount">Number of Questions</label>
                    <select id="quizCount">
                        <option value="5" selected>5 Questions</option>
                        <option value="10">10 Questions</option>
                        <option value="20">20 Questions</option>
                    </select>
                </div>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="isReplayable"> Allow students to replay this quiz
                    </label>
                    <label>
                        <input type="checkbox" id="isReviewable" checked> Allow students to review answers and explanations
                    </label>
                </div>
                
                <button id="generateBtn">Generate Quiz</button>
            </div>

            <div id="quizResults" class="quiz-results" style="display:none;">
                <!-- Results will appear here -->
            </div>
        </section>

        <section id="myQuizzesSection" class="my-quizzes">
            <h2>Your Recent Quizzes</h2>
            <div id="quizzesList" class="quizzes-grid">
                <p style="text-align: center; color: var(--text-muted);">Loading your quizzes...</p>
            </div>
        </section>

        <!-- Stats Modal -->
        <div id="statsModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">Quiz Statistics</h2>
                    <span class="close-modal" onclick="closeStatsModal()">&times;</span>
                </div>
                <div id="statsContainer" class="stats-container">
                    <p style="text-align: center;">Loading results...</p>
                </div>
            </div>
        </div>
        <!-- Edit Quiz Modal -->
        <div id="editQuizModal" class="modal" style="display: none;">
            <div class="modal-content" style="max-width: 800px;">
                <div class="modal-header">
                    <h2>Edit Quiz Content</h2>
                    <span class="close-modal" onclick="closeEditModal()">&times;</span>
                </div>
                <div id="editFormContainer" style="margin-top: 1rem;">
                    <!-- Dynamic form will be injected here -->
                </div>
                <div class="modal-footer" style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
                    <button id="saveEditBtn" onclick="saveQuizEdits()" style="width: auto; padding: 0.75rem 2rem;">Save Changes</button>
                </div>
            </div>
        </div>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/script.js?v=1.2"></script>
</body>
</html>
