<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 36'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%236366f1'/%3E%3Cstop offset='100%25' stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M8 10C8 6 11 2 16 2C21 2 24 6 24 10C24 14 22 17 18 19L17 20V24' stroke='url(%23g)' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='17' cy='31' r='2.5' fill='url(%23g)'/%3E%3C/svg%3E">
    <title>The Kriwils - My Quizzes</title>
    <link rel="stylesheet" href="css/style.css?v=2.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
</head>
<body class="body-hidden">
    <nav aria-label="Main navigation">
        <a href="/create" class="nav-brand brand-logo">
            <svg class="brand-logo-nav" viewBox="0 0 32 36" fill="none" aria-hidden="true">
                <defs>
                    <linearGradient id="logoGradA" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#6366f1"/>
                        <stop offset="100%" stop-color="#4f46e5"/>
                    </linearGradient>
                </defs>
                <path d="M8 10C8 6 11 2 16 2C21 2 24 6 24 10C24 14 22 17 18 19L17 20V24"
                      stroke="url(#logoGradA)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <circle cx="17" cy="31" r="2.5" fill="url(#logoGradA)"/>
            </svg>
            The Kriwils
        </a>
        <ul class="nav-links">
            <!-- Dynamically populated by auth.js -->
        </ul>
    </nav>

    <main>
        <h1>My Quizzes</h1>
        <div class="quizzes-quick-join">
            <input type="text" id="quickQuizCode" placeholder="Enter quiz code" maxlength="6" autocomplete="off">
            <button id="quickJoinBtn">Test</button>
        </div>
        <section id="myQuizzesSection" class="my-quizzes">
            <h2>Your Recent Quizzes</h2>
            <div class="quiz-controls">
                <input type="text" id="quizSearch" placeholder="Search quizzes..." autocomplete="off">
                <select id="quizSort">
                    <option value="newest">Newest</option>
                    <option value="questions">Most Questions</option>
                    <option value="hardest">Hardest</option>
                </select>
                <button id="viewToggle" class="view-toggle" onclick="toggleView()">List</button>
            </div>
            <div id="quizzesList" class="quizzes-grid">
                <div class="loading-wrapper loading-wrapper-full">
                    <div class="spinner"></div>
                    <p>Loading your quizzes...</p>
                </div>
            </div>
        </section>
        <div id="activityFeed" class="activity-feed hidden"></div>

        <!-- Stats Modal -->
        <div id="statsModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">Quiz Statistics</h2>
                    <span class="close-modal" onclick="closeStatsModal()">&times;</span>
                </div>
                <div id="statsContainer" class="stats-container">
                    <p class="loading-text-centered">Loading results...</p>
                </div>
            </div>
        </div>

        <!-- Edit Quiz Modal -->
        <div id="editQuizModal" class="modal hidden">
            <div class="modal-content modal-content-wide">
                <div class="modal-header">
                    <h2>Edit Quiz Content</h2>
                    <span class="close-modal" onclick="closeEditModal()">&times;</span>
                </div>
                <div id="editFormContainer" class="edit-form-container">
                    <!-- Dynamic form will be injected here -->
                </div>
                <div class="modal-footer">
                    <button id="saveEditBtn" onclick="saveQuizEdits()" class="save-btn">Save Changes</button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/auth.js?v=2.0"></script>
    <script src="js/quizzes.js?v=2.0"></script>
</body>
</html>
